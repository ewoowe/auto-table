[package]
name = "auto-table-core"
description = "Core library of auto-table: runtime support and error types for the #[auto_table] / #[auto_create] macros"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["mysql"]
# Database drivers (opt-in; they are additive, so several can be enabled at once)
mysql = ["sea-orm/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres"]
sqlite = ["sea-orm/sqlx-sqlite"]

[dependencies]
sea-orm.workspace = true
inventory.workspace = true
thiserror.workspace = true
auto-table-derive.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
