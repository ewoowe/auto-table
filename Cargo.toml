[workspace]
resolver = "2"
members = [
    "auto-table-core",
    "auto-table-derive",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
readme = "README.md"
description = "An automatic table-creation toolkit based on SeaORM: collects entities at compile time via attribute macros and creates database tables at startup"
keywords = ["sea-orm", "database", "table", "proc-macro", "orm"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[workspace.dependencies]
# The database driver is intentionally NOT listed here: it is opt-in through
# the `mysql` / `postgres` / `sqlite` features of auto-table-core, so that
# users only compile the drivers they actually need. The runtime and the
# derive macros are always required.
sea-orm = { version = "2.0.0", features = ["runtime-tokio-rustls", "macros"] }
inventory = "0.3"
thiserror = "1"
syn = { version = "3.0.3", features = ["full"] }
quote = "1"
auto-table-derive = { path = "auto-table-derive", version = "0.3.0" }
