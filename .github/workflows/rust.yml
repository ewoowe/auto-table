name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    # The MySQL and PostgreSQL end-to-end tests need real servers. SQLite needs
    # none: it uses the bundled engine against a temporary file.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auto_table_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_table_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d auto_table_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      AUTO_TABLE_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/auto_table_test
      AUTO_TABLE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/auto_table_test

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      # --all-features so the SQLite and PostgreSQL end-to-end tests are compiled in
      run: cargo test --all-features --verbose
