name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    # The MySQL and PostgreSQL end-to-end tests need real servers.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auto_table_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auto_table_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d auto_table_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      AUTO_TABLE_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/auto_table_test
      AUTO_TABLE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/auto_table_test

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --features "mysql postgres" --verbose
    - name: Run MySQL and PostgreSQL e2e tests
      # Runs the core unit tests (mysql/postgres gated) plus mysql_e2e and
      # pg_e2e. SQLite is exercised by the separate test-sqlite job below.
      run: cargo test --features "mysql postgres" --verbose

  test-sqlite:
    runs-on: ubuntu-latest

    # SQLite ships a bundled copy of the engine and every test runs against its
    # own temporary file, so it needs no external service.
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build -p auto-table-core --no-default-features --features sqlite --verbose
    - name: Run SQLite e2e tests
      run: cargo test -p auto-table-core --no-default-features --features sqlite --verbose
